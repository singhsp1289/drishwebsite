<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Drish Infotech — AI-Powered Engineering & Technology Solutions</title>
    <meta name="description" content="Global technology Solutions company delivering Artificial Intelligence, Device Drivers, IoT, Cloud, and Cyber Security enterprise solutions." />
    <meta name="theme-color" content="#1E8668" />
    
    <!-- Open Graph / Social Meta Tags -->
    <meta property="og:title" content="Drish Infotech — Engineering & Technology Solutions" />
    <meta property="og:description" content="AI-Powered Solutions • Cloud Computing • IoT & Embedded Systems • Cyber Security • Since 1999" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- High-priority DNS prefetch & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Asynchronous Non-blocking Font Loading with Instant System Fallback -->
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" 
    />
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" 
      media="print" 
      onload="this.media='all'" 
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <style>
      /* Critical Baseline CSS (Prevents Layout Shifts and FOUC) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAFCFA;
        color: #0F172A;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
